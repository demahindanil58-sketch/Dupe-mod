name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковка архива
        run: |      - name: Patch Loom and Fabric API versions
        run: |
          sed -i 's/id "fabric-loom" version ".*"/id "fabric-loom" version "1.14.17"/' settings.gradle
          sed -i 's/modImplementation "net.fabricmc.fabric-api:fabric-api.*"/modImplementation "net.fabricmc.fabric-api:fabric-api:1.21.11+build.1"/' build.gradle
          
          unzip -o dupe-mod-ready*.zip -d extracted
          ROOT=$(dirname "$(find extracted -name build.gradle | head -1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Найдена папка проекта: $ROOT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Сборка
        run: gradle build --stacktrace
        working-directory: ${{ env.ROOT }}
      - uses: actions/upload-artifact@v4
        with:
          name: dupe-mod-jar
          path: ${{ env.ROOT }}/build/libs/*.jar
          

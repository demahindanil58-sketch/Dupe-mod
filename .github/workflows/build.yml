name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковка архива
        run: |
          unzip -o dupe-mod-ready*.zip -d extracted
          ROOT=$(dirname "$(find extracted -name build.gradle | head -1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Найдена папка проекта: $ROOT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Сборка
        run: gradle build --stacktrace
        working-directory: ${{ env.ROOT }}
      - uses: actions/upload-artifact@v4
        with:
          name: dupe-mod-jar
          path: ${{ env.ROOT }}/build/libs/*.jar
          
